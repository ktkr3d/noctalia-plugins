id = "ktkr3d/jellyfin-browser"
name = "Jellyfin Browser"
version = "0.0.1"
plugin_api = 32

[[widget]]
id = "browser"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = false

[[panel]]
id = "panel"
entry = "browser.luau"
width = 480
height = 640
placement = "floating"
position = "center"
