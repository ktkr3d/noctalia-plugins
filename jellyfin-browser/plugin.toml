id = "ktkr3d/jellyfin-browser"
name = "Jellyfin Browser"
version = "0.0.3"
plugin_api = 32
author = "ktkr3d"
license = "MIT"
icon = "device-tv"
description = "Browse the Jellyfin server library and play media."
tags = ["music", "video", "widget"]
dependencies = ["mpv"]

[[widget]]
id = "browser"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_label"
  type = "bool"
  label_key = "settings.show_label.label"
  description_key = "settings.show_label.description"
  default = false

[[panel]]
id = "panel"
entry = "browser.luau"
width = 480
height = 640
placement = "floating"
position = "center"
